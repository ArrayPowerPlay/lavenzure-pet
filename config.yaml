# Calcifer Desktop Pet — configuration (non-secret settings; API keys live in .env)

llm:
  provider: gemini
  model: gemini-flash-latest # alias that always points at the newest Flash model (gemini-2.0-flash was shut down)
  temperature: 0.7
  api_version: v1beta # "-latest" model aliases are only served on v1beta
  timeout_seconds: 60 # give up on a Gemini call after this long
  max_retries: 2 # retries before showing an error in the chat

memory:
  idle_timeout_minutes: 10 # clear in-memory chat history after this many minutes of inactivity

character:
  scale: 0.75 # size multiplier of the code-drawn flame character (1.0 = 200x236 px window, 0.75 = 150x177)
  fps: 60 # redraw rate; lower it (e.g. 30) to save CPU
  flame_renderer: shader   # flame body: shader (GPU, chosen) | metaball | baked (pre-simulated clips); falls back to metaball

overlay:
  always_on_top: true
  click_through_transparent_areas: true

behavior:
  # relative weights used to randomly pick the next idle-time movement state
  state_weights:
    idle: 0.4
    walk: 0.25
    float: 0.25
    jump: 0.1

system_status:
  poll_interval_seconds: 45
  cpu_threshold_percent: 90
  ram_threshold_percent: 90
  battery_threshold_percent: 30

ambient:
  random_fact_or_joke:
    idle_minutes: 15 # trigger a random line after this many minutes without chat/click activity
    facts_file: data/facts_jokes.json

click_reaction:
  lines_file: data/click_reactions.json

tools:
  weather:
    provider: open-meteo
  web_search:
    provider: tavily

tray:
  start_visible: true

autostart:
  enabled: true
  method: startup_folder # startup_folder | task_scheduler (task_scheduler used after packaging to .exe)
