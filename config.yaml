# Lavenzure Desktop Pet — configuration (non-secret settings; API keys live in .env)

llm:
  provider: gemini
  model: gemini-flash-lite-latest # alias for the newest Flash-Lite: no "thinking", 2-3x faster replies than gemini-flash-latest (decision 2026-11-13)
  temperature: 0.7
  api_version: v1beta # "-latest" model aliases are only served on v1beta
  timeout_seconds: 60 # give up on a Gemini call after this long
  max_retries: 2 # retries before showing an error in the chat

memory:
  idle_timeout_minutes: 15 # wipe the chat (screen + memory) after this many minutes without chatting

character:
  scale: 0.75 # size multiplier of the code-drawn flame character (1.0 = 280x236 px window, 0.75 = 210x177)
  fps: 30 # default frame rate (user chose 30; Settings also offers 60); higher = more CPU
  flame_renderer: shader   # flame body: shader (GPU, chosen) | metaball | baked (pre-simulated clips); falls back to metaball

performance:
  # (The frame rate is character.fps; tray -> Settings can change it, and that choice is
  # remembered in %LOCALAPPDATA%\Lavenzure\settings.json and wins over config.yaml.)
  lite_flame: true # render the flame at a lower internal resolution (less GPU work; user chose it 2026-11-13)
  lite_flame_supersample: 1.5 # lite flame: bitmap pixels per screen pixel (normal = 2.0)

overlay:
  always_on_top: true
  click_through_transparent_areas: true

behavior:
  # relative weights used to randomly pick the next idle-time movement state
  state_weights:
    idle: 0.4
    walk: 0.25
    float: 0.25
    jump: 0.1
  doze_after_minutes: 10 # doze off after this long without mouse/keyboard input (wakes on input)
  night_start_hour: 20 # night look (calmer, slower; never forces sleep) from this hour...
  night_end_hour: 5 # ...until this hour

system_status:
  poll_interval_seconds: 45
  cpu_threshold_percent: 90
  ram_threshold_percent: 90
  battery_threshold_percent: 30

ambient:
  random_fact_or_joke:
    idle_minutes: 15 # trigger a random line after this many minutes without chat/click activity
    facts_file: data/facts_jokes.json

chat:
  auto_close_seconds: 30 # the chat bubble closes after this long without chatting

click_reaction:
  lines_file: data/click_reactions.json

tools:
  weather:
    provider: open-meteo
  web_search:
    provider: tavily

tray:
  start_visible: true

autostart:
  enabled: true
  method: startup_folder # startup_folder | task_scheduler (task_scheduler used after packaging to .exe)

diagnostics:
  frame_stats_seconds: 600 # write fps + time per frame to the log this often (0 = off)
