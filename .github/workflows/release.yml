# Builds the Windows zip and publishes a GitHub Release when a version tag is pushed.
#   git tag v0.1.0-rc.1 && git push origin v0.1.0-rc.1   -> trial build, marked "pre-release"
#   git tag v0.1.0      && git push origin v0.1.0         -> the real release
# Tags go on `main` only. The version number comes from the tag (see src/version.py).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `git describe` needs the tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint and test
        run: |
          python -m ruff check .
          python -m pytest

      - name: Build the zip
        run: python scripts/build.py "${{ github.ref_name }}"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip=$(ls dist/Lavenzure-*-win-x64.zip)
          sha=$(cut -d' ' -f1 "$zip.sha256")
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac   # v0.1.0-rc.1 -> pre-release
          printf '**SHA-256** of `%s`:\n\n`%s`\n\nWindows 10/11 only. Unzip, run `Lavenzure.exe`, then open Settings from the tray icon and enter your API key. If Windows shows "Windows protected your PC", click **More info → Run anyway** (the app is not code-signed).\n' \
            "$(basename "$zip")" "$sha" > notes.md
          gh release create "$TAG" "$zip" "$zip.sha256" \
            --title "Lavenzure $TAG" --notes-file notes.md --generate-notes $flags
