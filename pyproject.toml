# Project metadata, dependencies (locked in uv.lock) and tool configuration.
# The app is run as scripts from src/ and is not an installable package (`package = false`), so
# `version` below is only a placeholder: the real version always comes from the git tag
# (see src/version.py).

[project]
name = "lavenzure"
version = "0.0.0"
description = "Lavenzure: a flame desktop pet with an AI chat (Windows)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.2",
    "keyring>=25.0",
    "tavily-python>=0.5",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "psutil>=5.9",
]

[dependency-groups]
# Installed by default with `uv sync`.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyinstaller>=6.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".scratch", ".venv", ".venv-win"]

[tool.ruff.format]
# Files in this repo mix CRLF and LF; keep whatever each file already uses.
line-ending = "auto"

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, naming
select = ["F", "E", "W", "I", "B", "UP", "N"]
ignore = [
    "N802",  # Qt overrides must keep camelCase names (paintEvent, mousePressEvent, ...)
    "N803",  # `R` (radius) is used as an argument name throughout the drawing code
    "N806",  # ... and as a local variable
    "N815",  # Qt Property names are camelCase (exactPos)
]

[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["E402"]  # imports follow the OpenBLAS thread setting, which must come first
